#:tombi toml-version = "v1.1.0"
#:schema https://raw.githubusercontent.com/crate-ci/typos/master/config.schema.json

[files]
  ignore-files   = true
  ignore-hidden  = false
  ignore-vcs     = true
  ignore-dot     = true
  extend-exclude = [
    ".mailmap",
    ".config/treefmt.toml",
    ".config/mise*.toml",
    "*.sops.yaml",
    "*.png",
    "*.icns",
    "*.ico",
  ]

[default]
  check-filename   = true
  extend-ignore-re = [
    # PNG is a file format, not a typo
    "PNG",
    "doas",
    # macOS version
    "Big Sur",
  ]

  [default.extend-identifiers]
    # `AB` / `BA` are task-order condition labels; identifiers are case-sensitive,
    # so this accepts the uppercase label without allowing a lowercase `ba`.
    BA = "BA"

  [default.extend-words]
    writeable = "writeable"
